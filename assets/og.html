<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>IVE · Open Graph image</title>
<!-- Source of assets/og.png. Serve the site folder, open this file at exactly 1200×630 and capture the viewport. -->
<link rel="stylesheet" href="fonts.css">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 1200px; height: 630px; overflow: hidden; }
  body { position: relative; background: #0E1014; color: #F2F3F5; font-family: 'Source Sans 3', sans-serif; -webkit-font-smoothing: antialiased; }
  .mark { position: absolute; left: 64px; top: 56px; display: flex; align-items: baseline; gap: 6px; }
  .mark b { font: 800 30px/30px 'Archivo', sans-serif; font-stretch: 112%; letter-spacing: 0.01em; }
  .mark i { width: 8px; height: 8px; border-radius: 50%; background: #5B8CFF; }
  .copy { position: absolute; left: 64px; top: 176px; width: 510px; }
  h1 { font: 700 58px/1.05 'Archivo', sans-serif; font-stretch: 110%; letter-spacing: -0.03em; text-wrap: balance; }
  p { margin-top: 24px; font-size: 22px; line-height: 1.4; color: #C6CAD1; text-wrap: balance; }
  .foot { position: absolute; left: 64px; bottom: 52px; font: 500 16px/1 'IBM Plex Mono', monospace; color: #8B919B; }
  .foot b { color: #F2F3F5; font-weight: 500; }
  .frame { position: absolute; left: 610px; top: 112px; width: 860px; aspect-ratio: 16 / 10; overflow: hidden; border-radius: 10px; background: #0A0C0F; box-shadow: 0 0 0 1px rgba(255, 255, 255, 0.12), 0 24px 64px rgba(0, 0, 0, 0.55); }
  .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: 0 0; }
</style>
</head>
<body>
  <div class="mark"><b>IVE</b><i></i></div>
  <div class="copy">
    <h1>Run your coding agents side by side.</h1>
    <p>Claude Code, Codex and Gemini (Antigravity CLI) in one window.</p>
  </div>
  <div class="foot"><b>ive.dev</b> · Open source · Apache 2.0</div>
  <div class="frame"><img src="app/hero-board@2x.webp" alt=""></div>
</body>
</html>
