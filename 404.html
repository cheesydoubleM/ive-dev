<head>

<meta name="color-scheme" content="light dark">

<title>404 — IVE</title>

<style>
  :root {
    color-scheme: light;
    --bg: #F4F5F6;
    --bg-raised: #FFFFFF;
    --bg-inset: #EBEDEF;
    --bg-glass: rgba(244, 245, 246, 0.82);
    --on-accent: #15171A;
    --line: #DDE0E3;
    --line-strong: #BFC4C9;
    --text: #15171A;
    --text-dim: #4A4F55;
    --text-faint: #6B7178;
    --running: #FFB000;
    --running-ink: #8A5200;
    --complete: #087A4B;
    --complete-ink: #066B41;
    --waiting: #98A0A8;
    --waiting-ink: #5A6067;
    --attention: #C83B24;
    --attention-ink: #A82F1B;
    --route: #1647FF;
    --route-ink: #0E36C7;
    --focus: #1647FF;
    --invert-bg: #15171A;
    --invert-raised: #1E2125;
    --invert-text: #F4F5F6;
    --invert-dim: #A6ADB4;
    --invert-line: #2B2F34;
    --r-chip: 4px;
    --maxw: 1480px;
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #101012;
    --bg-raised: #17171A;
    --bg-inset: #0B0B0D;
    --bg-glass: rgba(16, 16, 18, 0.82);
    --on-accent: #0B0B0D;
    --line: #26262B;
    --line-strong: #34343B;
    --text: #EDEDE9;
    --text-dim: #A3A39E;
    --text-faint: #85857F;
    --running: #FFB454;
    --running-ink: #FFB454;
    --complete: #7DCE82;
    --complete-ink: #7DCE82;
    --waiting: #8A8A93;
    --waiting-ink: #8A8A93;
    --attention: #F2545B;
    --attention-ink: #F2545B;
    --route: #6BB6C9;
    --route-ink: #6BB6C9;
    --focus: #FFB454;
    --invert-bg: #F4F3EF;
    --invert-raised: #FFFFFF;
    --invert-text: #1A1A18;
    --invert-dim: #5C5C56;
    --invert-line: #D9D8D2;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  button { font: inherit; color: inherit; background: none; cursor: pointer; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Source Sans 3', system-ui, sans-serif;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 76px 24px 24px;
  }
  .theme-toggle {
    position: fixed; top: 20px; right: 20px;
    inline-size: 84px; padding: 7px 8px;
    border: 1px solid var(--line); border-radius: var(--r-chip);
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    font-size: 11px; font-weight: 500; line-height: 1.2;
    letter-spacing: 0.07em; text-align: center; white-space: nowrap;
  }
  .theme-toggle:hover { border-color: var(--line-strong); background: var(--bg-raised); }
  .box { max-width: min(560px, var(--maxw)); width: 100%; }
  .error-code {
    font-family: 'IBM Plex Mono', ui-monospace, monospace;
    color: var(--text-faint); font-size: 13px; letter-spacing: 0.08em;
  }
  h1 {
    font-family: 'Archivo', system-ui, sans-serif;
    font-stretch: 125%;
    font-weight: 620; font-size: clamp(32px, 3.6vw, 46px);
    letter-spacing: -0.04em; line-height: 1.04; text-wrap: balance; margin: 18px 0 10px;
  }
  p.sub { color: var(--text-dim); font-size: 16px; }
  a.back {
    display: inline-block; margin-top: 26px;
    background: var(--invert-bg); color: var(--invert-text);
    font-weight: 600; font-size: 15px; text-decoration: none;
    padding: 11px 20px; border-radius: 6px;
  }
  a.back:hover { background: var(--invert-raised); }
  a.gh { color: var(--text-dim); font-size: 14px; margin-left: 18px; }
  :focus-visible { outline: 2px solid var(--focus); outline-offset: 4px; border-radius: 2px; }
</style>
</head>
<body>
  <button class="theme-toggle" type="button" aria-pressed="false" aria-label="Switch to dark theme" data-theme-toggle>Light</button>
  <main class="box">
    <p class="error-code">404</p>
    <h1>Page not found.</h1>
    <p class="sub">The address may be incorrect, or the page may have moved.</p>
    <a class="back" href="index.html">Back to IVE</a>

    <a class="gh" href="index.html#waitlist">Join the beta →</a>
  </main>
  <script>
    (function () {
      var themeMeta = document.querySelector('meta[name="theme-color"]');
      var themeToggle = document.querySelector('[data-theme-toggle]');

      function readTheme() {
        try {
          var storedTheme = localStorage.getItem('ive-theme');
          if (storedTheme === 'dark' || storedTheme === 'light') return storedTheme;
        } catch (e) {}
        return 'light';
      }

      function applyTheme(theme, persist) {
        var isDark = theme === 'dark';
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        themeToggle.textContent = isDark ? 'Dark' : 'Light';
        themeToggle.setAttribute('aria-pressed', isDark ? 'true' : 'false');
        themeToggle.setAttribute('aria-label', isDark ? 'Switch to light theme' : 'Switch to dark theme');
        themeMeta.setAttribute('content', getComputedStyle(document.documentElement).getPropertyValue('--bg').trim());
        if (persist) {
          try { localStorage.setItem('ive-theme', isDark ? 'dark' : 'light'); } catch (e) {}
        }
      }

      applyTheme(readTheme(), false);
      themeToggle.addEventListener('click', function () {
        applyTheme(document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark', true);
      });

    })();
  </script>
</body>
</html>
